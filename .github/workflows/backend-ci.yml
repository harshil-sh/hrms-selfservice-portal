name: Backend CI

on:
  push:
    branches:
      - main
      - work
  pull_request:
    branches:
      - main

jobs:
  build-test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/Hrms.sln

      - name: Build
        run: dotnet build backend/Hrms.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Hrms.sln --no-build --configuration Release --verbosity normal
